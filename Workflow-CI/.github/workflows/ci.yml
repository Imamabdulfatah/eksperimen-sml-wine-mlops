name: CI - Model Training & Docker Build

on:
  push:
    branches: [ main ]
    paths:
      - 'MLProject/**'
  workflow_dispatch:

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: '3.10'
          activate-environment: mlflow-env

      - name: Install MLflow
        run: |
          pip install mlflow>=2.10.0

      - name: Run MLflow Project
        run: |
          cd MLProject
          mlflow run . --env-manager=local 2>&1 | tee mlflow_output.log

      - name: Save MLflow artifacts
        run: |
          mkdir -p saved_artifacts
          cp -r MLProject/mlruns saved_artifacts/ 2>/dev/null || true
          cp -r MLProject/artifacts saved_artifacts/ 2>/dev/null || true

      - name: Commit artifacts to repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add saved_artifacts/ || true
          git diff --cached --quiet || git commit -m "Auto-save model artifacts from CI [skip ci]"
          git push || true

      - name: Login to Docker Hub
        if: env.DOCKER_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image with MLflow
        if: env.DOCKER_USERNAME != ''
        run: |
          # Find the latest model run
          LATEST_RUN=$(ls -td MLProject/mlruns/*/runs/*/ 2>/dev/null | head -1)
          if [ -n "$LATEST_RUN" ]; then
            MODEL_URI="${LATEST_RUN}artifacts/model"
            mlflow models build-docker \
              --model-uri "$MODEL_URI" \
              --name "${{ secrets.DOCKER_USERNAME }}/wine-quality-model"
          else
            echo "No model run found, building from MLProject"
            mlflow models build-docker \
              --name "${{ secrets.DOCKER_USERNAME }}/wine-quality-model"
          fi

      - name: Push Docker Image
        if: env.DOCKER_USERNAME != ''
        run: |
          docker tag ${{ secrets.DOCKER_USERNAME }}/wine-quality-model:latest \
            ${{ secrets.DOCKER_USERNAME }}/wine-quality-model:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/wine-quality-model:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/wine-quality-model:${{ github.sha }}
          echo "Docker image pushed successfully!"
          echo "Image: ${{ secrets.DOCKER_USERNAME }}/wine-quality-model:latest"
