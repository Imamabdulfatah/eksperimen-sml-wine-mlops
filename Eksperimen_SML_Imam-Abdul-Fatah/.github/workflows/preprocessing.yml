name: Preprocessing Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'winequality_raw/**'
      - 'preprocessing/automate_Imam-Abdul-Fatah.py'
  workflow_dispatch:

jobs:
  preprocessing:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run preprocessing
        run: |
          cd preprocessing
          python automate_Imam-Abdul-Fatah.py

      - name: Commit preprocessed dataset
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add preprocessing/winequality_preprocessing/
          git diff --cached --quiet || git commit -m "Auto-update preprocessed dataset [skip ci]"
          git push
